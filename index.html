<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PurpleBird Partner Tasks</title>
<meta name="description" content="Private partner dashboard. Sign-in required.">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="same-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://purplebird.us; connect-src 'self' https://graph.microsoft.com https://login.microsoftonline.com; frame-src https://login.microsoftonline.com">
<meta name="theme-color" content="#FAF9FC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0618" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js" integrity="sha384-OJTwghM0Gh3Zc+gmd6l0lz1pFw9KuHHq0mSEZgmQEKgMnuSWWDb3bU9KzuD7w2hU" crossorigin="anonymous"></script>
<style>
:root{
  /* PurpleBird brand (purplebird.us): purple #5E17EB, deep purple #341171, indigo #5B4BD6, ink #1A1433,
     night #0B0618, muted #5B5675, lavender #C9B8FB #E4DAFE #E9E5F5, paper #FAF9FC, amber #FFB224 (sparingly).
     Legacy token names kept so the shared dashboard code works: espresso = deep purple, cream = paper. */
  --espresso:#341171; --red:#C8283C; --saffron:#FFB224; --teal:#5B4BD6; --charcoal:#1A1433; --cream:#FAF9FC;
  --pb-purple:#5E17EB; --pb-deep:#341171; --pb-indigo:#5B4BD6; --pb-lav:#C9B8FB; --pb-lav-2:#E4DAFE; --pb-lav-3:#E9E5F5;
  --bg:#FBFAFF; --surface:#FFFFFF; --surface-2:#F7F4FF; --sunken:#F0EBFC;
  --text:#1A1433; --text-2:#5B5675; --muted:#7A7494; --line:rgba(52,17,113,.07); --line-2:rgba(52,17,113,.14);
  --shadow-1:0 0 0 1px rgba(52,17,113,.04),0 1px 2px rgba(52,17,113,.04),0 8px 24px rgba(52,17,113,.06);
  --shadow-2:0 0 0 1px rgba(52,17,113,.05),0 4px 12px rgba(52,17,113,.08),0 24px 64px rgba(52,17,113,.16);
  /* partner shades: a = deep plum (Managing Partner), z = royal purple, n = lavender */
  --z:#5E17EB; --a:#341171; --n:#9B7BF7;
  --z-text:#5E17EB; --a-text:#341171; --n-text:#6B4FD8;
  --z-on:#FFFFFF; --a-on:#FFFFFF; --n-on:#341171;
  --z-tint:rgba(94,23,235,.08); --a-tint:rgba(52,17,113,.07); --n-tint:rgba(155,123,247,.14);
  --a-g:linear-gradient(135deg,#2A0D5E 0%,#341171 45%,#5B2BB5 100%);
  --z-g:linear-gradient(135deg,#4C10C9 0%,#5E17EB 50%,#8B5CF6 100%);
  --n-g:linear-gradient(135deg,#C9B8FB 0%,#E4DAFE 70%,#F1ECFE 100%);
  --grad-btn:linear-gradient(180deg,#7139F2 0%,#5E17EB 100%);
  --grad-bar:linear-gradient(90deg,#B9A2FA 0%,#7C4DF2 55%,#5E17EB 100%);
  --danger:#C8283C; --danger-bg:#FCE9EC; --warn-text:#8A5A00; --warn-bg:#FFF3D6;
  --ok-text:#341171; --ok-bg:#EFE9FF; --info-bg:#F3EEFF;
  --focus:#5E17EB;
  --radius:22px; --radius-s:14px;
  --font-head:"Plus Jakarta Sans",-apple-system,"Segoe UI",sans-serif;
  --font-display:"Instrument Serif",Georgia,serif;
  --font-body:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0618; --surface:#160E2B; --surface-2:#1E1438; --sunken:#110A22;
    --text:#F4F1FB; --text-2:#C9B8FB; --muted:#A59CC0; --line:rgba(233,229,245,.10); --line-2:rgba(233,229,245,.18);
    --shadow-1:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
    --shadow-2:0 2px 6px rgba(0,0,0,.5),0 18px 48px rgba(0,0,0,.55);
    --a:#C9B8FB; --a-on:#1A1433; --z:#8B5CF6; --n:#B49CF8;
    --a-g:linear-gradient(135deg,#341171,#5B2BB5); --z-g:linear-gradient(135deg,#5E17EB,#8B5CF6); --n-g:linear-gradient(135deg,#3A2A78,#5B4BD6); --n-on:#FFFFFF;
    --grad-btn:linear-gradient(180deg,#7139F2,#5E17EB); --grad-bar:linear-gradient(90deg,#8B5CF6,#C9B8FB);
    --z-text:#C9B8FB; --a-text:#E4DAFE; --n-text:#FFB224;
    --z-tint:rgba(94,23,235,.26); --a-tint:rgba(201,184,251,.14); --n-tint:rgba(255,178,36,.16);
    --danger:#F08A98; --danger-bg:rgba(200,40,60,.22); --warn-text:#FFC85C; --warn-bg:rgba(255,178,36,.16);
    --ok-text:#C9B8FB; --ok-bg:rgba(94,23,235,.22); --info-bg:rgba(233,229,245,.07);
    --focus:#C9B8FB; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0B0618; --surface:#160E2B; --surface-2:#1E1438; --sunken:#110A22;
    --text:#F4F1FB; --text-2:#C9B8FB; --muted:#A59CC0; --line:rgba(233,229,245,.10); --line-2:rgba(233,229,245,.18);
    --shadow-1:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
    --shadow-2:0 2px 6px rgba(0,0,0,.5),0 18px 48px rgba(0,0,0,.55);
    --a:#C9B8FB; --a-on:#1A1433; --z:#8B5CF6; --n:#B49CF8;
    --a-g:linear-gradient(135deg,#341171,#5B2BB5); --z-g:linear-gradient(135deg,#5E17EB,#8B5CF6); --n-g:linear-gradient(135deg,#3A2A78,#5B4BD6); --n-on:#FFFFFF;
    --grad-btn:linear-gradient(180deg,#7139F2,#5E17EB); --grad-bar:linear-gradient(90deg,#8B5CF6,#C9B8FB);
    --z-text:#C9B8FB; --a-text:#E4DAFE; --n-text:#FFB224;
    --z-tint:rgba(94,23,235,.26); --a-tint:rgba(201,184,251,.14); --n-tint:rgba(255,178,36,.16);
    --danger:#F08A98; --danger-bg:rgba(200,40,60,.22); --warn-text:#FFC85C; --warn-bg:rgba(255,178,36,.16);
    --ok-text:#C9B8FB; --ok-bg:rgba(94,23,235,.22); --info-bg:rgba(233,229,245,.07);
    --focus:#C9B8FB; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,h4{font-family:var(--font-head);margin:0;line-height:1.2;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.wrap{max-width:1440px;margin:0 auto;padding:0 24px}
@media (max-width:640px){.wrap{padding:0 16px}}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);border-bottom:1px solid var(--line)}
.hdr::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:var(--pattern);background-size:56px 56px;opacity:.07;-webkit-mask-image:linear-gradient(90deg,transparent 0,transparent 42%,#000 90%);mask-image:linear-gradient(90deg,transparent 0,transparent 42%,#000 90%)}
.hdr-in{display:flex;align-items:center;gap:20px;min-height:84px;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:6px;min-width:0}
.logo-plate{display:inline-flex;padding:22px 22px 22px 0;margin:-22px 0;border-radius:14px}
.logo-plate img{height:44px;width:auto;display:block}
.page-name{font-size:15px;font-weight:800;color:var(--text-2);white-space:nowrap;padding-left:2px}
.hdr-tools{margin-left:auto;display:flex;align-items:center;gap:12px}
.search{position:relative}
.search input{width:260px;height:40px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);padding:0 14px 0 38px;transition:width .25s var(--ease),box-shadow .2s}
.search input:focus{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 45%,transparent);border-color:var(--focus)}
.search svg{position:absolute;left:13px;top:11px;width:18px;height:18px;color:var(--muted)}
.sync{font-size:13px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--teal)}
.sync.busy .dot{background:var(--saffron);animation:pulse 1s infinite}
.sync.off .dot{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:600;transition:transform .15s var(--ease),background .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--pb-purple);border-color:var(--pb-purple);color:#fff}
.btn.primary:hover{background:#5419D8}
:root[data-theme="dark"] .btn.primary{background:var(--pb-purple);color:#fff;border-color:var(--pb-purple)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{background:var(--pb-purple);color:#fff;border-color:var(--pb-purple)}}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{height:32px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.me{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;cursor:pointer;border-radius:999px}
.me .who{text-align:right;line-height:1.2}
.me .who b{display:block;font-size:14px}
.me .who span{font-size:12px;color:var(--muted)}
@media (max-width:1100px){.page-name{display:none}.search input{width:200px}}
@media (max-width:820px){
  .hdr-in{flex-wrap:wrap;gap:10px;padding-top:10px;padding-bottom:10px;min-height:0}
  .logo-plate{padding:16px 16px 16px 0;margin:-16px 0}
  .logo-plate img{height:34px}
  .hdr-tools{display:contents}
  .sync{margin-left:auto}
  .search{order:5;flex:1 1 100%}
  .search input{width:100%}
  .me .who{display:none}
  .sync .label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  .add-label{display:none}
  .btn.add{width:40px;padding:0}
}

/* ---------- avatars ---------- */
.av{--c:var(--muted);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font:800 12px/1 var(--font-head);background:var(--surface);color:var(--text);box-shadow:0 0 0 2.5px var(--c),0 0 0 4px var(--surface);flex:none}
.av.lg{width:40px;height:40px;font-size:14px}
.av.sm{width:24px;height:24px;font-size:10px;box-shadow:0 0 0 2px var(--c),0 0 0 3.5px var(--surface)}
.avs{display:flex;align-items:center;gap:10px}
.av-z{--c:var(--z)} .av-a{--c:var(--a)} .av-n{--c:var(--n)}

/* ---------- nav ---------- */
.nav{display:flex;flex-direction:column;gap:12px;padding:22px 0 4px}
.nav-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tabs button{height:38px;padding:0 16px;font-size:15px}
.seg .count.bad{color:#fff;background:var(--danger);border-radius:999px;padding:1px 7px;font-weight:700}
.extra{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.extra button{border:0;background:none;height:34px;padding:0 12px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--text-2);cursor:pointer}
.extra button:hover{background:var(--sunken)}
.extra button[aria-pressed="true"],.extra button[aria-expanded="true"]{background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.extra .count{font-size:11.5px;background:var(--espresso);color:var(--cream);border-radius:999px;padding:1px 6px;margin-left:2px}
.people{display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.people::-webkit-scrollbar{display:none}
.people .lbl{font:800 11.5px/1 var(--font-head);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-right:2px;white-space:nowrap}
.people button{--c:var(--espresso);display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:13.5px;font-weight:600;white-space:nowrap;color:var(--text-2);flex:none}
.people button .av{margin-left:-8px}
.people button small{font-weight:500;color:var(--muted)}
.people button[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);color:var(--text);background:color-mix(in srgb,var(--c) 9%,var(--surface))}
@media (max-width:820px){.extra{margin-left:0}.tabs{width:100%}.tabs button{flex:1;padding:0 8px;font-size:14px}}

/* ---------- overview: who has what ---------- */
.ov{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-1);margin:20px 0 0;overflow:hidden}
.ov-h{display:flex;align-items:baseline;gap:6px 14px;padding:16px 20px 4px;flex-wrap:wrap}
.ov-h h2{font-size:20px}
.ov-h p{margin:0;color:var(--muted);font-size:13px}
.ov table{width:100%;border-collapse:collapse}
.ov th{font:800 11.5px/1 var(--font-head);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:center;padding:12px 8px 8px}
.ov td{padding:6px 8px;border-top:1px solid var(--line);text-align:center;vertical-align:middle}
.ov td:first-child{text-align:left;padding-left:16px;width:34%}
.ov tr.sel td{background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.ov tr.sel td:first-child{box-shadow:inset 4px 0 0 var(--c)}
.ov .who{display:flex;align-items:center;gap:12px;border:0;background:none;padding:6px 8px 6px 4px;cursor:pointer;text-align:left;color:inherit;border-radius:12px;min-width:0}
.ov button.who:hover{background:var(--sunken)}
.ov .who b{display:block;font:800 15.5px/1.25 var(--font-head)}
.ov .who b .you{display:inline;font:500 12px var(--font-body);color:var(--muted)}
.ov .who small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.ov .team-av{--c:var(--line-2);font-size:10.5px}
.ov .num{border:0;background:none;cursor:pointer;font:800 24px/1 var(--font-head);letter-spacing:-.02em;padding:9px 12px;border-radius:12px;min-width:60px;color:var(--text);transition:background .15s}
.ov .num:hover{background:var(--sunken)}
.ov .num.zero{color:var(--muted);opacity:.55;font-weight:700}
.ov .num.bad{color:var(--danger)}
.ov .num.good{color:#1F8A5B}
.ov .pbar{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding-right:12px}
.ov .pbar .bar{width:110px;margin:0}
.ov .pbar .bar i{background:#1F8A5B}
.ov .pbar span{font:800 13px var(--font-head);min-width:36px;text-align:right;color:var(--text-2)}
.ov tr.team td{background:var(--surface-2)}
.ov tr.team .num{font-size:20px}
@media (max-width:900px){.ov .pc{display:none}}
@media (max-width:640px){
  .ov thead{display:none}
  .ov tr{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding:8px 8px 10px}
  .ov td{border:0;padding:0}
  .ov td:first-child{grid-column:1/-1;width:auto;padding:0 0 4px}
  .ov .num{font-size:21px;padding:6px 4px 2px;min-width:0;width:100%}
  .ov td[data-l]::after{content:attr(data-l);display:block;font-size:11px;font-weight:600;color:var(--muted)}
}

/* ---------- task rows ---------- */
.rows{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-1);overflow:hidden}
.row{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 12px 12px 12px;border-top:1px solid var(--line);position:relative;transition:background .15s}
.row:first-child{border-top:0}
.row:hover{background:color-mix(in srgb,var(--sunken) 55%,var(--surface))}
.row-main{border:0;background:none;padding:0;text-align:left;cursor:pointer;min-width:0;color:inherit;display:block;border-radius:6px}
.row-main .t{display:block;font:700 15px/1.32 var(--font-head);color:var(--text)}
.row-main .m{display:flex;flex-wrap:wrap;align-items:center;gap:3px 12px;margin-top:4px;font-size:12.5px;color:var(--muted)}
.row-main .m .due{font-weight:600;color:var(--text-2)}
.row-main .m .due.over{color:var(--danger)}
.row-main .m .due.soon{color:var(--warn-text)}
.row-main .m .due.orig{color:var(--muted);font-weight:500}
.row-main .m .due svg{width:13px;height:13px}
.row-main .m .wait{color:var(--danger);font-weight:600}
.row-main .m .with{display:inline-flex;align-items:center;gap:7px}
.row-main .m .tid{font:600 11px/1 ui-monospace,"SF Mono",Menlo,monospace;color:var(--muted);opacity:.8}
.row-main .m .for{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:100%}
.row-main .m .ft{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row-main .m .chip{flex:none;font:800 10px/1 var(--font-head);padding:3px 5px;border-radius:5px;background:var(--c);color:var(--on)}
.row.done .t{text-decoration:line-through;text-decoration-color:var(--line-2);color:var(--muted)}
.row .st-btn{position:static;margin-top:-1px}
.av.xs{width:20px;height:20px;font-size:9px;box-shadow:0 0 0 1.5px var(--c),0 0 0 3px var(--surface)}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);display:grid;place-items:center;padding:0;margin-top:0;color:transparent;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.ck svg{width:14px;height:14px}
button.ck:hover,button.ck:focus-visible{border-color:#1F8A5B;color:#1F8A5B;background:color-mix(in srgb,#1F8A5B 10%,var(--surface))}
.ck.on{background:#1F8A5B;border-color:#1F8A5B;color:#fff}
.ck.off{border-style:dashed;opacity:.5;cursor:default}
.sq{position:relative;width:22px;height:22px;margin:1px 0 0 1px;cursor:pointer}
.sq input{position:absolute;inset:0;opacity:0;margin:0;cursor:inherit}
.sq span{position:absolute;inset:0;border-radius:6px;border:2px solid var(--line-2);background:var(--surface);display:grid;place-items:center;color:transparent;pointer-events:none;transition:all .15s}
.sq span svg{width:13px;height:13px}
.sq:hover input:not(:disabled)+span{border-color:#1F8A5B;color:#1F8A5B}
.sq input:checked+span{background:#1F8A5B;border-color:#1F8A5B;color:#fff}
.sq input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.sq.off{cursor:default}
.sq.off span{border-style:dashed;opacity:.5}
.sq.off input:checked+span{opacity:.7;border-style:solid}
.row.sub{grid-template-columns:26px minmax(0,1fr)}
.row.sub .t{font:600 14px/1.35 var(--font-body)}
.cal-day-list{padding:14px 16px;border-top:1px solid var(--line)}
.cal-day-list h4{font-size:14px;margin:0 0 8px;color:var(--text-2)}
@media (max-width:760px){.cal-day-list{display:none}}
@media (max-width:640px){
  .ov tr.team{background:var(--surface-2)}
  .ov tr.team td{background:none}
  .row{grid-template-columns:26px minmax(0,1fr);grid-template-areas:"ck main" "ck st"}
  .row>.ck,.row>.sq{grid-area:ck}
  .row>.row-main{grid-area:main}
  .row>.st-btn{grid-area:st;justify-self:start;margin-top:2px}
  .row.sub{grid-template-areas:"ck main"}
  .extra{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;width:100%;gap:2px}
  .extra::-webkit-scrollbar{display:none}
  .extra button{padding:0 10px;flex:none;font-size:13px}
}
@media (max-width:480px){
  .tabs button{flex-direction:column;height:50px;padding:0 4px;gap:1px;line-height:1.1;font-size:13.5px;display:flex;align-items:center;justify-content:center}
  .tabs .count{margin-left:0}
}

/* ---------- states ---------- */
.center-screen{min-height:calc(100vh - 90px);display:grid;place-items:center;padding:30px 16px}
.signin{max-width:440px;width:100%;background:var(--surface);border-radius:26px;box-shadow:var(--shadow-2);padding:40px 34px;text-align:center}
.signin .logo-plate{margin:0 auto 16px;display:flex;justify-content:center;background:var(--pb-deep);padding:22px 26px}
.signin .logo-plate img{height:auto;width:100%;max-width:240px}
.signin h1{font-size:22px;margin:4px 0 8px}
.signin p{color:var(--text-2);margin:0 0 22px}
.signin .err{text-align:left;margin-top:18px}
.skel{border-radius:16px;background:linear-gradient(90deg,var(--sunken) 0%,var(--surface-2) 50%,var(--sunken) 100%);background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.toast-wrap{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--espresso);color:var(--cream);padding:11px 18px;border-radius:999px;box-shadow:var(--shadow-2);font-size:14px;font-weight:600;pointer-events:auto;display:flex;gap:12px;align-items:center;animation:toastIn .25s var(--ease)}
.toast button{background:none;border:0;color:var(--saffron);font-weight:800;cursor:pointer;padding:0}
@keyframes toastIn{from{transform:translateY(10px);opacity:0}}
:root[data-theme="dark"] .toast{background:var(--cream);color:var(--espresso)}
:root[data-theme="dark"] .toast button{color:#915E25}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast{background:var(--cream);color:var(--espresso)}:root:not([data-theme="light"]) .toast button{color:#8A5A00}}
.foot{padding:10px 0 40px;font-size:12px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}
.foot button{background:none;border:0;color:var(--text-2);cursor:pointer;text-decoration:underline;font-size:12px;padding:0}

/* PurpleBird logo is the white version, so it always sits on a deep purple plate */
.hdr .logo-plate{background:var(--pb-deep);padding:12px 16px;margin:-4px 10px -4px 0}
.hdr .logo-plate img{height:30px}
@media (max-width:820px){.hdr .logo-plate{padding:10px 12px;margin:0}.hdr .logo-plate img{height:24px}}
.page-name{font-family:var(--font-display);font-weight:400;font-size:22px;letter-spacing:0;color:var(--text)}
.signin h1{font-family:var(--font-display);font-weight:400;font-size:34px;letter-spacing:0}
/* =====================================================================
   Bright, Apple-like PurpleBird skin (November 24, 2026)
   Soft lavender light, white glass surfaces, three purple partner shades.
   ===================================================================== */
body{background:
  radial-gradient(1200px 520px at 8% -8%,rgba(201,184,251,.42),transparent 60%),
  radial-gradient(900px 480px at 100% 0%,rgba(228,218,254,.55),transparent 62%),
  var(--bg);background-attachment:fixed;letter-spacing:-.005em}
:root[data-theme="dark"] body{background:radial-gradient(1000px 500px at 10% -10%,rgba(94,23,235,.22),transparent 60%),var(--bg)}
h1,h2,h3,h4{letter-spacing:-.022em;font-weight:800}
.hdr{background:rgba(255,255,255,.72);backdrop-filter:saturate(1.8) blur(24px);-webkit-backdrop-filter:saturate(1.8) blur(24px);border-bottom:1px solid rgba(52,17,113,.06)}
:root[data-theme="dark"] .hdr{background:rgba(11,6,24,.72)}
.hdr::after{display:none}
.hdr-in{min-height:72px}
.hdr .logo-plate{background:linear-gradient(135deg,#5E17EB 0%,#341171 100%);border-radius:14px;box-shadow:0 6px 18px rgba(94,23,235,.28),inset 0 1px 0 rgba(255,255,255,.18)}
.page-name{color:var(--pb-deep);font-size:24px}
:root[data-theme="dark"] .page-name{color:var(--pb-lav)}
.search input{background:rgba(118,92,190,.08);border-color:transparent}
.search input:focus{background:var(--surface)}
.btn{border-color:var(--line-2);font-weight:600}
.btn.primary{background:var(--grad-btn);border-color:transparent;box-shadow:0 6px 16px rgba(94,23,235,.30),inset 0 1px 0 rgba(255,255,255,.22)}
.btn.primary:hover{background:var(--grad-btn);filter:brightness(1.06)}
.sync .dot{background:#8B5CF6;box-shadow:0 0 0 3px rgba(139,92,246,.18)}
.av{background:var(--surface);color:var(--text)}
.av-a{color:#341171}.av-z{color:#5E17EB}.av-n{color:#6B4FD8}
:root[data-theme="dark"] .av-a,:root[data-theme="dark"] .av-z,:root[data-theme="dark"] .av-n{color:var(--text)}

/* segmented tabs and chips */
.seg{background:rgba(118,92,190,.10);padding:3px}
.seg button{height:34px;font-weight:600;color:var(--text-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--pb-deep);box-shadow:0 1px 2px rgba(52,17,113,.10),0 3px 10px rgba(52,17,113,.08)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:var(--text)}
.extra button{color:var(--text-2)}
.extra button:hover{background:rgba(118,92,190,.10)}
.extra button[aria-pressed="true"],.extra button[aria-expanded="true"]{background:var(--surface);color:var(--pb-deep);box-shadow:0 1px 2px rgba(52,17,113,.10),0 3px 10px rgba(52,17,113,.08)}
.extra .count{background:var(--pb-purple);color:#fff}
.people button{border-color:transparent;background:rgba(255,255,255,.75);box-shadow:var(--shadow-1)}
.people button[aria-pressed="true"]{border-color:transparent;box-shadow:0 0 0 1.5px var(--c),0 4px 12px rgba(94,23,235,.12);background:color-mix(in srgb,var(--c) 8%,var(--surface));color:var(--text)}

/* overview card with a soft lavender hero */
.ov{border-radius:24px;box-shadow:var(--shadow-1);background:linear-gradient(180deg,#F6F1FF 0,#FFFFFF 92px)}
:root[data-theme="dark"] .ov{background:var(--surface)}
.ov-h{padding:20px 22px 6px}
.ov-h h2{font-size:22px;color:var(--pb-deep)}
:root[data-theme="dark"] .ov-h h2{color:var(--text)}
.ov th{color:#8A7FB0;font-weight:700;letter-spacing:.06em}
.ov td{border-top:1px solid rgba(52,17,113,.06)}
.ov .num{font-weight:800;letter-spacing:-.03em}
.ov td:nth-child(2) .num:not(.zero){color:#341171}
.ov td:nth-child(3) .num:not(.zero){color:#5E17EB}
.ov td:nth-child(5) .num:not(.zero){color:#8B5CF6}
:root[data-theme="dark"] .ov td:nth-child(2) .num:not(.zero){color:#E4DAFE}
:root[data-theme="dark"] .ov td:nth-child(3) .num:not(.zero){color:#C9B8FB}
.ov .num:hover{background:rgba(118,92,190,.08)}
.ov .pbar .bar i,.bar i{background:var(--accent,var(--grad-bar))}
.ov .pbar .bar i{background:var(--grad-bar)}
.ov tr.team td{background:rgba(240,235,252,.7)}
:root[data-theme="dark"] .ov tr.team td{background:var(--surface-2)}
.bar{background:rgba(118,92,190,.12);height:7px}

/* partner columns: white cards with a purple gradient header in each partner's shade */
.col{background:rgba(255,255,255,.82);border-radius:24px;box-shadow:var(--shadow-1);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
:root[data-theme="dark"] .col{background:var(--surface)}
.col-head{background:var(--g,var(--c));padding:16px 18px;min-height:64px}
.col-head h3{font-size:18px}
.col-head .av{background:rgba(255,255,255,.95);box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.col-head .col-n{background:rgba(255,255,255,.18);padding:5px 11px;border-radius:999px;font-size:12.5px}
.col[style*="--n-on"] .col-head .col-n{background:rgba(52,17,113,.10)}
.col-body{padding:14px 14px 16px}
.grp-h{color:#8A7FB0;letter-spacing:.07em}
.rows{border-radius:16px;box-shadow:0 0 0 1px rgba(52,17,113,.05),0 2px 8px rgba(52,17,113,.04)}
.row{padding:13px 14px}
.row:hover{background:#FAF7FF}
:root[data-theme="dark"] .row:hover{background:var(--surface-2)}
.row-main .t{font-weight:700;letter-spacing:-.01em}
.ck{border-color:rgba(94,23,235,.30)}
button.ck:hover,button.ck:focus-visible{border-color:#5E17EB;color:#5E17EB;background:rgba(94,23,235,.08)}
.ck.on{background:#5E17EB;border-color:#5E17EB}
.sq span{border-color:rgba(94,23,235,.30)}
.sq:hover input:not(:disabled)+span{border-color:#5E17EB;color:#5E17EB}
.sq input:checked+span{background:#5E17EB;border-color:#5E17EB}
.empty{border:1.5px dashed rgba(94,23,235,.18);background:rgba(247,244,255,.6)}

/* status chips: soft, rounded, purple family; red and green only where meaning needs it */
.sc{box-shadow:none;font-weight:700;height:25px;padding:0 11px 0 10px}
.sc-notstarted{--sc:#F0EBFC;--sc-on:#5B5675;box-shadow:none}
.sc-progress{--sc:linear-gradient(135deg,#7C4DF2,#5E17EB);--sc-on:#FFFFFF}
.sc-blocked{--sc:#FDE8EC;--sc-on:#C8283C}
.sc-done{--sc:#E6F6EE;--sc-on:#1F7A50}
.sc-confirm{--sc:#FFF3D6;--sc-on:#8A5A00}
.pill{background:#F0EBFC;color:#5B5675}
.st-progress{background:#EFE9FF;color:#5E17EB}
:root[data-theme="dark"] .sc-notstarted{--sc:var(--sunken);--sc-on:var(--text-2)}

/* summary, calendar, decisions, banners */
.sum-card,.cal,.dec{border-radius:24px;box-shadow:var(--shadow-1)}
.sum-card::before{background:var(--g,var(--c));width:6px}
.ring .val{stroke-linecap:round}
.cal-day.today .dn{background:var(--pb-purple)}
.cal-chip{background:#F4F0FF}
.dec th{background:#F7F4FF;color:#8A7FB0}
@media (min-width:761px){.dec td:nth-child(3){width:42%;min-width:320px}.dec td:nth-child(1),.dec td:nth-child(2){white-space:nowrap}}
.banner{border-radius:16px}
.banner.info{background:linear-gradient(90deg,#F1ECFE,#F8F5FF);color:var(--text)}
.banner.warn{background:linear-gradient(90deg,#FFF4DA,#FFF9EC)}

/* sheets and dialogs */
dialog::backdrop{background:rgba(26,20,51,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet-h::before{background:var(--accent);height:4px}
.x{background:#F0EBFC}
.addsub,.suggest{background:#F7F4FF}
.fld input,.fld select,.fld textarea,.addsub-f input,.addsub-f select{border-color:rgba(52,17,113,.14)}
.chk input,.subl input{accent-color:#5E17EB}
.toast{background:rgba(52,17,113,.94);color:#fff;backdrop-filter:blur(10px)}
.signin{border-radius:28px;background:linear-gradient(180deg,#F6F1FF 0,#FFFFFF 160px)}
.signin .logo-plate{background:linear-gradient(135deg,#5E17EB,#341171);border-radius:18px;box-shadow:0 10px 30px rgba(94,23,235,.30)}
:root[data-theme="dark"] .signin{background:var(--surface)}
.foot{color:#8A7FB0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="hdr" id="hdr" hidden>
  <div class="wrap hdr-in">
    <div class="brand">
      <span class="logo-plate"><img class="logo" alt="PurpleBird"></span>
      <h1 class="page-name">Partner Tasks Dashboard</h1>
    </div>
    <div class="hdr-tools">
      <div class="search" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <label class="sr-only" for="q">Search tasks</label>
        <input id="q" type="search" placeholder="Search tasks" autocomplete="off">
      </div>
      <div class="sync" id="sync" aria-live="polite"><span class="dot"></span><span class="label" id="syncLabel">Loading</span></div>
      <button class="btn primary add" id="addBtn" type="button" aria-label="Add task"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="add-label">Add task</span></button>
      <button class="me" id="meBtn" type="button" aria-label="Account and display options"></button>
    </div>
  </div>
</header>

<main id="main"></main>
<div class="toast-wrap" id="toasts" aria-live="polite" aria-atomic="false"></div>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle"></dialog>
<dialog class="small-dlg" id="dlg"></dialog>
<div class="st-menu" id="stMenu" role="menu" aria-label="Change task status"></div>

function setupPartners(list){
  const partners = (list||[]).filter(p => (p.Role||"Partner") === "Partner");
  const rows = partners.map(p => ({p, k: COLOR_KEY[(p.ColorHex||"").toUpperCase()] || DOMAIN_KEY[(p.Domains||"").split(";")[0].trim()]})).filter(x => x.k);
  rows.sort((a,b) => "azn".indexOf(a.k) - "azn".indexOf(b.k));
  ORDER = rows.map(x => x.p.ShortName); PKEY = {}; INITIALS = {}; DISPLAY = {}; ROLE = {}; SUPERVISOR = {};
  OTHERS = (list||[]).filter(p => p.Role && p.Role !== "Partner").map(p => p.ShortName);
  (list||[]).filter(p => p.Role && p.Role !== "Partner").forEach(p => {
    DISPLAY[p.ShortName] = p.ShortName; SUPERVISOR[p.ShortName] = p.Supervisor || "";
    const m = p.ShortName.match(/^Intern (\d+)$/); INITIALS[p.ShortName] = m ? "I" + m[1] : (p.ShortName.includes("CPA") ? "CPA" : "EX");
  });
  rows.forEach(({p,k}) => {
    PKEY[p.ShortName] = k; ROLE[k] = p.ShortName;
    const paren = (p.FullName||"").match(/\(([^)]+)\)/);
    const words = (p.FullName||p.ShortName).replace(/\(.*\)/,"").trim().split(/\s+/);
    const d = paren ? paren[1] : words.slice(-2).join(" ");
    const w = d.split(/\s+/);
    DISPLAY[p.ShortName] = d; INITIALS[p.ShortName] = (w[0][0] + (w.length > 1 ? w[w.length-1][0] : "")).toUpperCase();
  });
}

const pad = n => String(n).padStart(2,"0");
const localISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = () => localISO(new Date());

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function fmtDate(iso){ if(!iso) return ""; const [y,m,d] = iso.slice(0,10).split("-").map(Number); if(!y||!m||!d) return iso; return `${MONTHS[m-1]} ${d}, ${y}`; }
function fmtMonth(ym){ const [y,m] = ym.split("-").map(Number); return `${MONTHS[m-1]} ${y}`; }
function fmtStamp(ts){ if(!ts) return ""; const d = new Date(ts); if(isNaN(d)) return ts; return `${fmtDate(localISO(d))}, ${fmtTime(d)}`; }
function fmtTime(d){ let h=d.getHours(), m=d.getMinutes(); const ap = h>=12?"pm":"am"; h = h%12||12; return `${h}:${pad(m)} ${ap}`; }

  const pct = t.Status === "Done" ? 100 : (subs.length ? Math.round(done / subs.length * 100) : 0);

function normValue(col, v){
  if (v === null || v === undefined) return "";
  if (DATE_COLS.has(col) && typeof v === "number" && v > 20000){ const d = new Date(Date.UTC(1899,11,30) + v*86400000); return d.toISOString().slice(0,10); }

  return typeof v === "string" ? v.trim() : String(v);
}

class GraphError extends Error { constructor(status, code, message){ super(message); this.status = status; this.code = code; } }

class GraphStore {
  constructor(auth){ this.auth = auth; this.sessionId = null; }
  get wb(){ return `/drives/${KC_CONFIG.driveId}/items/${KC_CONFIG.itemId}/workbook`; }
  async call(method, path, body){
    const token = await this.auth.token();
    const headers = {Authorization: "Bearer " + token};
    if (body !== undefined) headers["Content-Type"] = "application/json";
    if (this.sessionId) headers["workbook-session-id"] = this.sessionId;
    let res;
    for (let attempt = 0; attempt < 5; attempt++){
      res = await fetch(GRAPH + path, {method, headers, body: body === undefined ? undefined : JSON.stringify(body)});
      if ([429,503,504].includes(res.status)){ const wait = Number(res.headers.get("Retry-After")) || 2**attempt; await new Promise(r=>setTimeout(r, Math.min(wait,20)*1000)); continue; }
      break;
    }
    if (!res.ok){
      let code = "", msg = res.statusText;
      try { const j = await res.json(); code = j.error?.code || ""; msg = j.error?.message || msg; } catch(e){}
      throw new GraphError(res.status, code, msg);
    }
    if (res.status === 204) return {};
    const ct = res.headers.get("Content-Type") || "";
    return ct.includes("json") ? res.json() : {};
  }
  async me(){ return this.call("GET", "/me?$select=displayName,mail,userPrincipalName"); }
  cols(table){ return (this.headers && this.headers[table]) || SCHEMA[table]; }
  async readTable(name){
    const r = await this.call("GET", `${this.wb}/tables/${name}/range?$select=values`);
    const values = r.values || [];
    if (!values.length) return [];
    const head = values[0];
    (this.headers = this.headers || {})[name] = head;
    return values.slice(1).map((row, i) => {
      const rec = {}; head.forEach((h, j) => rec[h] = normValue(h, row[j]));
      Object.defineProperty(rec, "_index", {value:i, enumerable:false});
      Object.defineProperty(rec, "_blank", {value:row.every(v => v === "" || v === null), enumerable:false});
      return rec;
    });
  }
  async readAll(){
    const names = Object.keys(SCHEMA);
    const res = await Promise.all(names.map(n => this.readTable(n)));
    const out = {}; names.forEach((n,i) => out[n] = res[i].filter(r => !r._blank)); return out;
  }
  async readRow(table, id){ const rows = await this.readTable(table); return rows.find(r => r[KEYS[table]] === id) || null; }
  async patch(table, rec){
    const rows = await this.readTable(table);
    const row = rows.find(r => r[KEYS[table]] === rec[KEYS[table]]);
    if (!row) throw new GraphError(404, "rowNotFound", `${rec[KEYS[table]]} was not found in ${table}.`);
    await this.call("PATCH", `${this.wb}/tables/${table}/rows/itemAt(index=${row._index})`, {values:[this.cols(table).map(c => rec[c] ?? "")]});
  }
  async patchMany(table, recs){
    if (!recs.length) return;
    const rows = await this.readTable(table);
    for (const rec of recs){
      const row = rows.find(r => r[KEYS[table]] === rec[KEYS[table]]);
      if (!row) throw new GraphError(404, "rowNotFound", `${rec[KEYS[table]]} was not found in ${table}.`);
      await this.call("PATCH", `${this.wb}/tables/${table}/rows/itemAt(index=${row._index})`, {values:[this.cols(table).map(c => rec[c] ?? "")]});
    }
  }
  async add(table, recs){
    if (!recs.length) return;
    const existing = await this.readTable(table);
    let rows = recs.map(rec => this.cols(table).map(c => rec[c] ?? ""));
    if (existing.length === 1 && existing[0]._blank){
      await this.call("PATCH", `${this.wb}/tables/${table}/rows/itemAt(index=0)`, {values:[rows[0]]});
      rows = rows.slice(1);
    }
    for (let i = 0; i < rows.length; i += 40) await this.call("POST", `${this.wb}/tables/${table}/rows/add`, {values: rows.slice(i, i+40)});
  }
  async session(fn){
    const s = await this.call("POST", `${this.wb}/createSession`, {persistChanges:true});
    this.sessionId = s.id;
    try { return await fn(); }
    finally { try { await this.call("POST", `${this.wb}/closeSession`); } catch(e){} this.sessionId = null; }
  }
}

class MemoryStore {
  constructor(data){ this.data = JSON.parse(JSON.stringify(data)); }
  async delay(){ await new Promise(r => setTimeout(r, 180)); }
  async me(){ return {}; }
  async readAll(){ await this.delay(); return JSON.parse(JSON.stringify(this.data)); }
  async readRow(table, id){ await this.delay(); const r = this.data[table].find(x => x[KEYS[table]] === id); return r ? {...r} : null; }
  async patch(table, rec){ await this.delay(); const i = this.data[table].findIndex(x => x[KEYS[table]] === rec[KEYS[table]]); this.data[table][i] = {...rec}; }
  async patchMany(table, recs){ for (const r of recs) await this.patch(table, r); }
  async readTable(table){ await this.delay(); return JSON.parse(JSON.stringify(this.data[table])); }
  async add(table, recs){ await this.delay(); this.data[table].push(...recs.map(r => ({...r}))); }
  async session(fn){ return fn(); }
}

/* =====================================================================
   Auth (MSAL 2.x, redirect flow works on phones)
   ===================================================================== */
const Auth = {
  app: null, account: null,
  async init(){
    this.app = new msal.PublicClientApplication({
      auth: {clientId: KC_CONFIG.clientId, authority: `https://login.microsoftonline.com/${KC_CONFIG.tenant}`, redirectUri: location.origin + location.pathname.replace(/index\.html$/, ""), navigateToLoginRequestUrl: true},
      cache: {cacheLocation: "localStorage", storeAuthStateInCookie: false}
    });
    const res = await this.app.handleRedirectPromise();
    this.account = res?.account || this.app.getAllAccounts()[0] || null;
    if (!this.account){
      // On Azure Static Web Apps the partner is already signed in; try silent single sign-on.
      try {
        const r = await fetch("/.auth/me"); const j = r.ok ? await r.json() : null;
        const hint = j?.clientPrincipal?.userDetails;
        if (hint){ const sso = await this.app.ssoSilent({scopes: SCOPES, loginHint: hint}); this.account = sso.account; }
      } catch(e){}
    }
    return this.account;
  },
  login(){ return this.app.loginRedirect({scopes: SCOPES, prompt: "select_account"}); },
  async token(){
    try { return (await this.app.acquireTokenSilent({scopes: SCOPES, account: this.account})).accessToken; }
    catch(e){
      if (e instanceof msal.InteractionRequiredAuthError){ await this.app.acquireTokenRedirect({scopes: SCOPES, account: this.account}); }
      throw e;
    }
  },
  logout(){ return this.app.logoutRedirect({account: this.account, postLogoutRedirectUri: location.origin + location.pathname.replace(/index\.html$/, "")}); }
};

function friendlyError(e){
  const code = (e && (e.errorCode || e.code)) || "";
  const msg = (e && (e.errorMessage || e.message)) || "";
  if (!navigator.onLine) return "You are offline. Reconnect to the internet and the dashboard will refresh on its own.";
  if (code === "user_cancelled") return "Sign-in was cancelled. Select Sign in to try again.";
  if (code === "interaction_in_progress") return "A sign-in is already in progress. Finish it, or reload this page.";
  if (/AADSTS65001|consent_required/i.test(code + msg)) return "Your Microsoft 365 administrator needs to approve this app before it can open the shared workbook. Ask the dashboard admin to request admin consent.";
  if (/AADSTS50105|AADSTS50020|AADSTS90072/i.test(msg)) return "This Microsoft account is not allowed to use the dashboard. Sign in with your partner Microsoft 365 account.";
  if (/AADSTS700016|AADSTS90002/i.test(msg)) return "The dashboard's sign-in settings do not match the Microsoft 365 tenant. Ask the dashboard admin to check the app registration.";
  if (/AADSTS9002326/i.test(msg)) return "This web address is registered with the wrong type for sign-in. Ask the dashboard admin to list it under Single-page application (not Web) in the app registration.";
  if (/AADSTS50011/i.test(msg)) return "This web address is not registered for sign-in yet. Ask the dashboard admin to add it as a redirect URI in the app registration.";
  if (e instanceof GraphError){
    if (e.status === 401) return "Your sign-in expired. Sign in again.";
    if (e.status === 403) return "You are signed in, but your account cannot open the workbook. Ask the dashboard admin to share the \"PurpleBird Partner Tasks\" folder with you with edit access.";
    if (e.status === 404) return "The workbook could not be found. It may have been moved or renamed. Ask the dashboard admin to check the \"PurpleBird Partner Tasks\" folder.";
    if (e.status === 409 || e.status === 423) return "The workbook is busy, probably because someone is editing it in Excel. Try again in a minute.";
    if (e.status >= 500) return "Microsoft 365 is having trouble right now. The dashboard will try again shortly.";
    return `Microsoft 365 returned an error: ${e.message}`;
  }
  if (/Failed to fetch|NetworkError|network/i.test(msg)) return "Cannot reach Microsoft 365 right now. Check your internet connection.";
  return msg || "Something went wrong.";
}

async function boot(){
  document.querySelectorAll("img.logo").forEach(i => i.src = LOGO_SRC);
  /* header pattern removed for a cleaner look */
  try { const t = localStorage.getItem("pb-theme"); if (t !== "auto") document.documentElement.dataset.theme = t || "light"; } catch(e){ document.documentElement.dataset.theme = "light"; }
  const params = new URLSearchParams(location.search);
  if (["light","dark"].includes(params.get("theme"))) document.documentElement.dataset.theme = params.get("theme");
  S.month = todayISO().slice(0,7); S.calMonth = S.month;
  const validView = v => VIEWS.some(x => x[0] === v);
  try { const so = JSON.parse(localStorage.getItem("pb-sort") || "{}"); if (so && typeof so === "object") S.sort = so; } catch(e){}
  try { const v = sessionStorage.getItem("pb-view"); if (validView(v)) S.view = v; S.person = sessionStorage.getItem("pb-person") || ""; } catch(e){}
  if (validView(params.get("view"))) S.view = params.get("view");
  if (params.has("preview")){
    S.mode = "preview";
    const kind = params.get("preview") || "seed";
    try {
      const r = await fetch(`preview-${kind}.json`, {cache:"no-store"});
      if (!r.ok) throw new Error(`preview-${kind}.json not found`);
      const data = await r.json();
      S.store = new MemoryStore(data);
      S.previewKind = kind;
      setupPartners(data.People);
      const as = ORDER.includes(params.get("as")) ? params.get("as") : ORDER[ORDER.length-1];
      S.me = {short: as, name: DISPLAY[as] || as, email: ((data.People||[]).find(p => p.ShortName === as)||{}).Email};
      showApp(); await refresh(true);
    } catch(e){ renderFatal("Preview data could not be loaded. " + e.message); }
    return;
  }
  // Local testing only: ?item=<id> points the page at a test copy of the workbook.
  if (["localhost","127.0.0.1"].includes(location.hostname) && params.get("item")){ KC_CONFIG.itemId = params.get("item"); S.testItem = true; }
  if (!KC_CONFIG.clientId || !KC_CONFIG.driveId){
    renderFatal("The dashboard is not connected to the workbook yet. The app registration ID and workbook location still need to be added to the page settings. See README.md.");
    return;
  }
  try {
    const acct = await Auth.init();
    if (!acct){ renderSignIn(); return; }
    S.store = new GraphStore(Auth);
    const me = await S.store.me();
    const email = (me.mail || me.userPrincipalName || "").toLowerCase();
    showApp(); await refresh(true);
    const p = S.data.People.find(p => (p.Email||"").toLowerCase() === email && (p.Role||"Partner") === "Partner" && (p.DashboardAccess||"Yes") === "Yes");
    if (!p){ renderFatal(`You are signed in as ${email}, which does not have dashboard access in the workbook. Sign in with your partner account, or ask the dashboard admin to update the People table.`, true); return; }
    S.me = {short: p.ShortName, name: DISPLAY[p.ShortName] || p.FullName, email};
    render();
  } catch(e){ console.error(e); renderSignIn(friendlyError(e)); }
}

function showApp(){ $("#hdr").hidden = false; wireHeader(); }

async function refresh(first=false){
  if (S.syncing || S.writing) return;
  if (!navigator.onLine){ setSync("off"); return; }
  S.syncing = true; setSync("busy");
  try {
    const data = await S.store.readAll();
    S.data = data; setupPartners(data.People); S.error = null; S.loading = false; S.lastSync = new Date();
    setSync("ok");
  } catch(e){
    console.error(e); S.error = friendlyError(e); S.loading = false; setSync("off");
    if (e.status === 401){ /* token redirect handled in Auth.token */ }
  } finally { S.syncing = false; }
  if (S.me || S.mode === "preview") render();
  else if (first && S.loading) renderLoading();
}

function setSync(state){
  const el = $("#sync"); if (!el) return;
  el.className = "sync" + (state === "busy" ? " busy" : state === "off" ? " off" : "");
  const label = $("#syncLabel");
  if (state === "busy") label.textContent = "Syncing";
  else if (state === "off") label.textContent = navigator.onLine ? "Not synced" : "Offline";
  else label.textContent = S.lastSync ? `Synced ${fmtTime(S.lastSync)}` : "Synced";
  el.title = S.lastSync ? `Last synced ${fmtStamp(S.lastSync.toISOString())}. Refreshes every 60 seconds.` : "";
}

setInterval(() => { if (S.store && document.visibilityState === "visible") refresh(); }, 60000);

window.addEventListener("online", () => { if (S.store) refresh(); });
window.addEventListener("offline", () => { setSync("off"); render(); });

/* =====================================================================
   Derived data and metrics
   ===================================================================== */
function isOverdue(t){ return t.DueDate && t.DueDate < todayISO() && !["Done","To confirm"].includes(t.Status); }
function dueClass(t){
  if (!t.DueDate || t.Status === "Done") return "";
  if (t.Status === "To confirm" && t.DueDate < todayISO()) return "orig";
  if (t.DueDate < todayISO()) return "over";
  if (t.DueDate <= addDays(todayISO(), 3)) return "soon";
  return "";
}
function dueText(t){
  if (!t.DueDate) return "No due date";
  const c = dueClass(t);
  if (c === "orig") return `Original date ${fmtDate(t.DueDate)}`;
  if (c === "over") return `Overdue, ${fmtDate(t.DueDate)}`;
  if (t.DueDate === todayISO()) return `Due today, ${fmtDate(t.DueDate)}`;
  return `Due ${fmtDate(t.DueDate)}`;
}
function metrics(p, ym){
  const start = ym + "-01", end = monthEnd(ym), t0 = todayISO(), wk = addDays(t0, 6);
  const T = S.data.Tasks, U = S.data.Subtasks;
  const leadDue = T.filter(t => t.Lead === p && t.DueDate >= start && t.DueDate <= end);
  const excluded = leadDue.filter(t => ["To confirm","Blocked"].includes(t.Status));
  const counted = leadDue.filter(t => !excluded.includes(t));
  const done = counted.filter(t => t.Status === "Done" && t.CompletedAt && t.CompletedAt.slice(0,10) <= end);
  const subs = U.filter(s => s.Owner === p && s.DueDate >= start && s.DueDate <= end && !["To confirm","Blocked"].includes(s.Status));
  const subsDone = subs.filter(s => s.Status === "Done");
  const lead = T.filter(t => t.Lead === p);
  return {
    rate: counted.length ? done.length / counted.length : null, done: done.length, counted: counted.length,
    subRate: subs.length ? subsDone.length / subs.length : null, subDone: subsDone.length, subCount: subs.length,
    toConfirm: excluded.filter(t => t.Status === "To confirm").length, blocked: excluded.filter(t => t.Status === "Blocked").length,
    open: lead.filter(t => t.Status !== "Done").length,
    week: lead.filter(t => t.Status !== "Done" && t.DueDate && t.DueDate >= t0 && t.DueDate <= wk).length,
    overdue: lead.filter(isOverdue).length,
    doneMonth: lead.filter(t => t.Status === "Done" && ymOf(t.CompletedAt) === ym).length
  };
}

/* ---------- filtering ---------- */
function matchesFilters(t){
  const f = S.filters;
  if (f.status && t.Status !== f.status) return false;
  if (f.domain && t.Domain !== f.domain) return false;
  if (f.source && !t.Source.startsWith(f.source)) return false;
  if (S.q){
    const q = S.q.toLowerCase();
    const hay = [t.TaskID, t.Title, t.Description, t.Notes, t.Source, t.Lead, t.Support].join(" ").toLowerCase();
    const subHit = subsOf(t.TaskID).some(s => s.Title.toLowerCase().includes(q));
    if (!hay.includes(q) && !subHit) return false;
  }
  return true;
}
function viewPredicate(view){
  const t0 = todayISO();
  switch(view){
    case "pending": return {task: t => t.Status !== "Done", sub: s => s.Status !== "Done"};
    case "overdue": return {task: isOverdue, sub: s => s.DueDate && s.DueDate < t0 && !["Done","To confirm"].includes(s.Status)};
    case "done": return {task: t => t.Status === "Done", sub: s => s.Status === "Done"};
    default: return {task: () => true, sub: () => true};
  }
}
/* Per-column sort. "smart" keeps the original order: open before done, overdue first, then by due date. */
const SORTS = [["smart","Smart order"],["due","Due date, soonest first"],["dueDesc","Due date, latest first"],["newest","Newest added"],["updated","Recently updated"],["priority","Priority, high first"]];
const PRI = {High:0, Medium:1, Low:2};
const byDue = (a, b, dir) => { const x = a.DueDate||"", y = b.DueDate||""; if (!x !== !y) return x ? -1 : 1; return dir * x.localeCompare(y); };
function sortByMode(list, mode, isSub){
  const l = list.slice();
  const subNew = (a, b) => b.SubtaskID.localeCompare(a.SubtaskID);
  switch (mode){
    case "due": return l.sort((a,b) => byDue(a,b,1) || (isSub ? a.SubtaskID.localeCompare(b.SubtaskID) : a.TaskID.localeCompare(b.TaskID)));
    case "dueDesc": return l.sort((a,b) => byDue(a,b,-1) || (isSub ? a.SubtaskID.localeCompare(b.SubtaskID) : a.TaskID.localeCompare(b.TaskID)));
    case "newest": return l.sort(isSub ? subNew : (a,b) => (b.CreatedAt||"").localeCompare(a.CreatedAt||"") || b.TaskID.localeCompare(a.TaskID));
    case "updated": return l.sort((a,b) => (b.UpdatedAt||"").localeCompare(a.UpdatedAt||"") || (isSub ? subNew(a,b) : b.TaskID.localeCompare(a.TaskID)));
    case "priority": return l.sort((a,b) => { const ta = isSub ? taskById(a.TaskID) : a, tb = isSub ? taskById(b.TaskID) : b; return ((PRI[ta?.Priority]??1) - (PRI[tb?.Priority]??1)) || byDue(a,b,1); });
    default:
      if (isSub) return l.sort((a,b) => (a.Status==="Done")-(b.Status==="Done") || (a.DueDate||"9").localeCompare(b.DueDate||"9") || a.SubtaskID.localeCompare(b.SubtaskID));
      return S.view === "done" ? sortTasks(l).sort((a,b) => (b.CompletedAt||"").localeCompare(a.CompletedAt||"")) : sortTasks(l);
  }
}
function setSort(p, mode){ S.sort[p] = mode; try{ localStorage.setItem("pb-sort", JSON.stringify(S.sort)); }catch(e){} }
function sortTasks(list){
  const pr = {High:0, Medium:1, Low:2};
  return list.slice().sort((a,b) => {
    const ad = a.Status === "Done", bd = b.Status === "Done"; if (ad !== bd) return ad ? 1 : -1;
    const ao = isOverdue(a), bo = isOverdue(b); if (ao !== bo) return ao ? -1 : 1;
    const ac = a.Status === "To confirm", bc = b.Status === "To confirm"; if (ac !== bc) return ac ? 1 : -1;
    if ((a.DueDate||"9") !== (b.DueDate||"9")) return (a.DueDate||"9") < (b.DueDate||"9") ? -1 : 1;
    return (pr[a.Priority]??1) - (pr[b.Priority]??1);
  });
}

  html += `<footer class="foot"><span>Private to the partners. Data stays in the shared Microsoft 365 workbook.</span><span><button type="button" data-act="theme">Appearance: ${themeLabel()}</button></span></footer></div>`;

  // Keep an open status menu open across the background refresh, linked to the new icon.

    const nb = main.querySelector(`[data-status="${CSS.escape(menu.dataset.for)}"]:not(:disabled)`);
    if (nb && taskById(menu.dataset.for)){ nb.setAttribute("aria-expanded","true"); S.menuBtn = nb; } else closeStatusMenu();
  }
}

/* "Who has what": one row per partner, counting the tasks they lead. Assigned = Pending + Completed. */

    <td data-l="Assigned">${num(tr.assigned,"all","","Team: all tasks")}</td><td data-l="Pending">${num(tr.pending,"pending","","Team: pending")}</td>

function ring(p, m){
  const R = 48, r = 33, C = 2*Math.PI*R, c = 2*Math.PI*r;
  const v = m.rate == null ? 0 : m.rate, sv = m.subRate == null ? 0 : m.subRate;
  const a80 = 0.8 * 2 * Math.PI;
  const x1 = 56 + (R-7)*Math.cos(a80), y1 = 56 + (R-7)*Math.sin(a80), x2 = 56 + (R+7.5)*Math.cos(a80), y2 = 56 + (R+7.5)*Math.sin(a80);
  const label = m.rate == null ? "n/a" : Math.round(v*100) + "%";
  return `<div class="ring" role="img" aria-label="${esc(DISPLAY[p])}: ${m.rate==null?"no lead tasks due this month":label+" of lead tasks done this month"}; sub-tasks ${m.subRate==null?"none due":Math.round(sv*100)+"%"}">
    <svg viewBox="0 0 112 112" aria-hidden="true">
      <circle class="track" cx="56" cy="56" r="${R}" fill="none" stroke-width="12"/>
      <circle class="val" cx="56" cy="56" r="${R}" fill="none" stroke="var(--${PKEY[p]})" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-v)}" ${v===0?'opacity="0"':""}/>
      <circle class="track" cx="56" cy="56" r="${r}" fill="none" stroke-width="7"/>
      <circle class="val" cx="56" cy="56" r="${r}" fill="none" stroke="var(--${PKEY[p]})" stroke-opacity=".55" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-sv)}" ${sv===0?'opacity="0"':""}/>
      <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <div class="center"><div><b>${label}</b><small>lead tasks</small></div></div></div>`;
}

function renderSummary(){
  const ym = S.month;
  const tip = `<b>How the monthly completion rate works</b><br>Big ring: tasks where the partner is lead, with a due date in ${fmtMonth(ym)}, completed by month end, divided by all such tasks. Tasks marked To confirm or Blocked are shown separately and left out of both numbers, so a partner is not marked down for work that is waiting on someone else.<br>Small ring: sub-tasks the partner owns that are due in ${fmtMonth(ym)} and done, divided by all such sub-tasks.<br>The tick on the ring is the partners' agreed 80% line.`;
  let html = `<section aria-labelledby="sumH"><div class="sum-head"><h2 id="sumH">Monthly score</h2>
    <div class="month-nav"><button type="button" data-act="mprev" aria-label="Previous month">${ICON.left}</button><span>${fmtMonth(ym)}</span><button type="button" data-act="mnext" aria-label="Next month">${ICON.right}</button></div>
    <button type="button" class="info-btn" aria-label="How this is calculated" aria-expanded="false" data-act="tip">i<span class="tip" role="tooltip">${tip}</span></button></div><div class="summary">`;
  for (const pr of partnerList()){
    const p = pr.ShortName, m = metrics(p, ym);

      <div class="line80">${line}</div>
      <div class="excl">Inner ring, sub-tasks: ${m.subRate==null?`none due in ${MONTHS[+ym.slice(5)-1]}`:`${m.subDone} of ${m.subCount} done (${Math.round(m.subRate*100)}%)`}.</div>
      ${(m.toConfirm||m.blocked)?`<div class="excl">Shown separately: ${m.toConfirm} To confirm, ${m.blocked} Blocked.</div>`:""}
    </div></article>`;
  }
  return html + `</div></section>`;

/* One task as a compact row: done circle (lead only), title and one line of key facts, status label (lead can change). */
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function doneCircle(t){
  const isLead = S.me && t.Lead === S.me.short, done = t.Status === "Done";
  if (done) return `<span class="ck on" role="img" aria-label="Completed">${CHECK}</span>`;
  if (!isLead) return `<span class="ck off" title="Only ${esc(DISPLAY[t.Lead]||t.Lead)}, the lead, can mark this done" aria-hidden="true"></span>`;
  return `<button type="button" class="ck" data-done="${esc(t.TaskID)}" title="Mark done" aria-label="${esc(`Mark ${t.TaskID} done: ${t.Title}`)}">${CHECK}</button>`;
}
function renderCard(t){
  const subs = subsOf(t.TaskID), sdone = subs.filter(s => s.Status === "Done").length;
  const dc = dueClass(t), done = t.Status === "Done";
  const when = done ? `Completed ${fmtDate((t.CompletedAt||"").slice(0,10)) || ""}`.trim() : dueText(t);
  const bits = [`<span class="due ${done?"":dc}">${ICON.cal}${esc(when)}</span>`];
  if (subs.length) bits.push(`<span>${sdone} of ${subs.length} sub-tasks</span>`);
  else if (t.Status === "Needs sub-tasks") bits.push(`<span>Sub-tasks pending</span>`);
  if (t.Priority === "High" && !done) bits.push(`<span class="prio high">High priority</span>`);
  if (t.Status === "Blocked" && t.BlockedReason) bits.push(`<span class="wait">Waiting on: ${esc(t.BlockedReason)}</span>`);
  if (t.AllPartnerApproval === "Yes"){
    const n = ORDER.filter(p => t["Approved"+p] === "Yes").length;
    bits.push(`<span title="Needs approval from all partners">Approvals ${n} of ${ORDER.length}</span>`);
  }
  const help = supports(t);
  return `<div class="row ${done?"done":""}" style="--accent:var(--${PKEY[t.Lead]})">${doneCircle(t)}
    <button type="button" class="row-main" data-open="${esc(t.TaskID)}" aria-label="${esc(`${t.TaskID}, ${t.Title}, ${t.Status}, ${when}. Open details.`)}">
      <span class="t">${esc(t.Title)}</span>
      <span class="m">${bits.join("")}${help.length?`<span class="with">with ${help.map(s => av(s,"xs")).join("")}</span>`:""}<span class="tid">${esc(t.TaskID)}</span></span>
    </button>${statusBtn(t)}</div>`;
}

/* A sub-task this partner owns on another partner's task. The owner can tick it right here. */
function renderSubRow(s){
  const t = taskById(s.TaskID); if (!t) return "";
  const mine = canTick(s), done = s.Status === "Done";
  const over = !done && s.DueDate && s.DueDate < todayISO() && s.Status !== "To confirm";
  return `<div class="row sub ${done?"done":""}">
    <label class="sq ${mine?"":"off"}" title="${mine?(done?"Reopen this sub-task":"Tick when done"):`Only ${esc(DISPLAY[s.Owner]||s.Owner)} can tick this`}"><input type="checkbox" data-sub="${esc(s.SubtaskID)}" ${done?"checked":""} ${mine?"":"disabled"} aria-label="${esc(`${s.SubtaskID} ${s.Title}${done?", done":""}`)}"><span aria-hidden="true">${CHECK}</span></label>
    <button type="button" class="row-main" data-open="${esc(t.TaskID)}" aria-label="${esc(`${s.Title}, for ${t.Title}. Open task.`)}">
      <span class="t">${esc(s.Title)}</span>
      <span class="m"><span class="for"><span class="chip" style="${pc(t.Lead)}" title="Lead: ${esc(DISPLAY[t.Lead])}">${esc(INITIALS[t.Lead])}</span><span class="ft">${esc(t.Title)}</span></span>${s.DueDate?`<span class="due ${over?"over":""}">${over?"Overdue, ":"Due "}${fmtDate(s.DueDate)}</span>`:""}${!["Not started","Done"].includes(s.Status)?`<span>${esc(s.Status)}</span>`:""}</span>
    </button></div>`;
}

function renderBoard(people, single){
  const pred = viewPredicate(S.view);
  const tasks = S.data.Tasks.filter(matchesFilters).filter(pred.task);
  const visibleTaskIds = new Set(S.data.Tasks.filter(matchesFilters).map(t => t.TaskID));
  let html = `<div class="board ${single?"one":""}">`;
  for (const p of people){
    const mode = SORTS.some(x => x[0] === S.sort[p]) ? S.sort[p] : "smart";
    const leading = sortByMode(tasks.filter(t => t.Lead === p), mode, false);
    const supporting = sortByMode(S.data.Subtasks.filter(s => s.Owner === p && visibleTaskIds.has(s.TaskID) && taskById(s.TaskID)?.Lead !== p && pred.sub(s)), mode, true);
    const limit = S.showAll[p] ? 1e9 : (single ? 30 : 12), slimit = S.showAll[p+"s"] ? 1e9 : (single ? 20 : 5);
    const label = {pending:"pending", overdue:"overdue", done:"completed", all:"tasks"}[S.view] || "tasks";
    html += `<section class="col" style="${pc(p)}" aria-labelledby="h-${p}">
      <div class="col-head">${av(p)}<h3 id="h-${p}">${esc(DISPLAY[p])}${S.me&&S.me.short===p?` <small>(you)</small>`:""}</h3><span class="col-n">${leading.length} ${label}</span></div>
      <div class="col-body">
        <div class="col-tools"><label for="sort-${p}">Sort</label><select id="sort-${p}" data-sort="${esc(p)}" aria-label="Sort ${esc(DISPLAY[p])}'s tasks">${SORTS.map(([k,l]) => `<option value="${k}" ${k===mode?"selected":""}>${l}</option>`).join("")}</select></div>
        <div class="grp"><div class="grp-h"><span>Leading</span><span class="n">${leading.length}</span></div>
          ${leading.length ? `<div class="rows">${leading.slice(0,limit).map(renderCard).join("")}</div>` : `<div class="empty">${emptyText("lead")}</div>`}
          ${leading.length>limit?`<button type="button" class="btn small more" data-more="${p}">Show all ${leading.length}</button>`:""}</div>
        ${supporting.length ? `<div class="grp"><div class="grp-h"><span>Helping on</span><span class="n">${supporting.length} sub-task${supporting.length===1?"":"s"}</span></div>
          <div class="rows">${supporting.slice(0,slimit).map(renderSubRow).join("")}</div>
          ${supporting.length>slimit?`<button type="button" class="btn small more" data-more="${p}s">Show all ${supporting.length}</button>`:""}</div>` : ""}
      </div></section>`;
  }
  return html + `</div>`;
}
function emptyText(kind){
  if (S.q || activeFilters()) return "Nothing matches the search or filters.";
  const map = {pending:"Nothing pending. All caught up.", overdue:"Nothing overdue. Nice work.", done:"Nothing completed yet."};
  return map[S.view] || "No tasks to lead right now.";
}

function renderCalendar(){
  const ym = S.calMonth; const [y,m] = ym.split("-").map(Number);
  const first = new Date(y, m-1, 1); const startOffset = first.getDay();
  const start = new Date(y, m-1, 1 - startOffset);
  const tasks = S.data.Tasks.filter(matchesFilters).filter(t => t.DueDate && (!S.person || t.Lead === S.person || supports(t).includes(S.person)));
  const byDay = {}; tasks.forEach(t => (byDay[t.DueDate] = byDay[t.DueDate] || []).push(t));
  const t0 = todayISO();
  let grid = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d => `<div class="cal-dow">${d}</div>`).join("");
  for (let i = 0; i < 42; i++){
    const d = new Date(start); d.setDate(start.getDate()+i); const iso = localISO(d);
    if (i >= 35 && d.getMonth() !== m-1) break;
    const list = sortTasks(byDay[iso] || []);
    grid += `<div class="cal-day ${d.getMonth()!==m-1?"out":""} ${iso===t0?"today":""}"><span class="dn">${d.getDate()}</span>${list.slice(0,3).map(t => `<button type="button" class="cal-chip ${t.Status==="Done"?"done":""}" style="--c:var(--${PKEY[t.Lead]})" data-open="${esc(t.TaskID)}" title="${esc(t.TaskID+": "+t.Title)}"><i></i><span>${esc(t.Title)}</span></button>`).join("")}${list.length>3?`<button type="button" class="cal-more" data-day="${iso}">+${list.length-3} more</button>`:""}</div>`;
  }
  const monthTasks = sortTasks(tasks.filter(t => ymOf(t.DueDate) === ym)).sort((a,b) => a.DueDate.localeCompare(b.DueDate));
  const days = [...new Set(monthTasks.map(t => t.DueDate))];
  const list = days.length ? days.map(d => `<h4>${fmtDate(d)}</h4><div class="rows">${monthTasks.filter(t=>t.DueDate===d).map(renderCard).join("")}</div>`).join("") : `<div class="empty">No due dates in ${fmtMonth(ym)}.</div>`;
  return `<section class="cal" aria-label="Calendar"><div class="cal-h"><h3>${fmtMonth(ym)}</h3><button type="button" class="btn small" data-act="ctoday">Today</button><button type="button" class="btn small" data-act="cprev" aria-label="Previous month">${ICON.left}</button><button type="button" class="btn small" data-act="cnext" aria-label="Next month">${ICON.right}</button></div><div class="cal-grid">${grid}</div>${S.calDay && byDay[S.calDay] && ymOf(S.calDay) === ym ? `<div class="cal-day-list"><h4>${fmtDate(S.calDay)}</h4><div class="rows">${sortTasks(byDay[S.calDay]).map(renderCard).join("")}</div></div>` : ""}<div class="cal-list">${list}</div></section>`;
}

function renderDecisions(){

/* =====================================================================
   Events
   ===================================================================== */
function wireHeader(){
  if (wireHeader.done) return; wireHeader.done = true;
  let tmr; $("#q").addEventListener("input", e => { clearTimeout(tmr); tmr = setTimeout(() => { S.q = e.target.value.trim(); render(); }, 150); });
  $("#addBtn").onclick = () => openForm();
  $("#meBtn").onclick = () => openAccount();
  document.addEventListener("keydown", e => { if (e.key === "/" && !/input|textarea|select/i.test(document.activeElement.tagName)){ e.preventDefault(); $("#q").focus(); } });
}
function wireMain(){
  const main = $("#main");
  main.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { setView(b.dataset.view); render(); });
  main.querySelectorAll("[data-filter]").forEach(s => s.onchange = () => { S.filters[s.dataset.filter] = s.value; render(); });
  main.querySelectorAll("[data-sort]").forEach(s => s.onchange = () => { setSort(s.dataset.sort, s.value); render(); });
  main.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openTask(b.dataset.open));
  main.querySelectorAll("[data-status]:not(:disabled)").forEach(b => b.onclick = e => { e.stopPropagation(); openStatusMenu(b); });
  main.querySelectorAll("[data-more]").forEach(b => b.onclick = () => { S.showAll[b.dataset.more] = true; render(); });
  main.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { S.calDay = b.dataset.day; render(); main.querySelector(".cal-day-list")?.scrollIntoView({behavior:"smooth", block:"nearest"}); });
  main.querySelectorAll("[data-person]").forEach(b => b.onclick = () => { setPerson(b.dataset.person === S.person && b.classList.contains("who") ? "" : b.dataset.person); render(); });
  main.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { setView(b.dataset.go); setPerson(b.dataset.p); render(); main.querySelector(".board")?.scrollIntoView({behavior:"smooth", block:"start"}); });
  main.querySelectorAll("[data-done]").forEach(b => b.onclick = e => { e.stopPropagation(); setTaskStatus(b.dataset.done, "Done"); });
  main.querySelectorAll("input[data-sub]").forEach(cb => cb.onchange = () => toggleSub(cb.dataset.sub, cb.checked, cb));
  main.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    const a = b.dataset.act;
    if (a === "mprev") S.month = shiftMonth(S.month, -1);
    if (a === "mnext") S.month = shiftMonth(S.month, 1);
    if (a === "cprev") S.calMonth = shiftMonth(S.calMonth, -1);
    if (a === "cnext") S.calMonth = shiftMonth(S.calMonth, 1);
    if (a === "ctoday") S.calMonth = todayISO().slice(0,7);
    if (a === "theme") { cycleTheme(); }
    if (a === "filters") S.showFilters = !S.showFilters;
    if (a === "clearf") S.filters = {status:"",domain:"",source:""};
    if (a === "tip") { b.setAttribute("aria-expanded", b.getAttribute("aria-expanded")==="true"?"false":"true"); return; }
    render();
  });
}
function setView(v){ S.view = v; try{ sessionStorage.setItem("pb-view", v); }catch(e){} }
function setPerson(p){ S.person = p || ""; try{ sessionStorage.setItem("pb-person", S.person); }catch(e){} }
function themeLabel(){ const t = document.documentElement.dataset.theme; return t === "dark" ? "Dark" : t === "light" ? "Light" : "Automatic"; }
function cycleTheme(){
  const t = document.documentElement.dataset.theme; const next = !t ? "light" : t === "light" ? "dark" : "";
  if (next) document.documentElement.dataset.theme = next; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem("pb-theme", next || "auto"); } catch(e){}
}

/* ---------- toasts ---------- */
function toast(msg, action){
  const el = document.createElement("div"); el.className = "toast"; el.innerHTML = `<span>${esc(msg)}</span>`;
  if (action){ const b = document.createElement("button"); b.textContent = action.label; b.onclick = () => { action.fn(); el.remove(); }; el.appendChild(b); }
  $("#toasts").appendChild(el); setTimeout(() => el.remove(), action ? 9000 : 4200);
}
