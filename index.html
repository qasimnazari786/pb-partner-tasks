function limitSupport(form){
  const lead = form.Lead.value; const cbs = [...form.querySelectorAll('input[name="Support"]')];
  cbs.forEach(cb => { if (cb.value === lead){ cb.checked = false; cb.disabled = true; } else cb.disabled = false; });
  const on = cbs.filter(cb => cb.checked); if (on.length > 2) on[2].checked = false;
}
$("#sheet").addEventListener("close", () => { S.openSheet = null; });
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") e.target.close(); });

function formChanges(form, base){
  const fd = new FormData(form); const ch = {};
  for (const k of ["Title","Status","Priority","StartDate","DueDate","Lead","Domain","Recurrence","BlockedReason","Description","Notes"]){
    const v = clean(fd.get(k)); if (v !== (base[k]||"")) ch[k] = v;
  }
  const sup = fd.getAll("Support").filter(s => s !== (fd.get("Lead"))).slice(0,2).join(";");
  if (sup !== (base.Support||"")) ch.Support = sup;
  return ch;
}

/* =====================================================================
   Writes (concurrency-safe)
   ===================================================================== */
const logRow = (action, taskId, details) => ({Timestamp: nowStamp(), User: S.me.short, Action: action, TaskID: taskId, Details: details});

async function guarded(fn){
  if (!navigator.onLine){ toast("You are offline. Reconnect and try again."); return false; }
  S.writing = true; setSync("busy");
  try { return await fn(); }
  catch(e){ console.error(e); showError(friendlyError(e)); return false; }
  finally { S.writing = false; setSync("ok"); }
}

async function checkFresh(table, base){
  const fresh = await S.store.readRow(table, base[KEYS[table]]);
  if (!fresh) throw new GraphError(404, "rowNotFound", "This item no longer exists in the workbook.");
  if (fresh.UpdatedAt === base.UpdatedAt) return {fresh, ok: true};
  return {fresh, ok: false};
}

async function saveTask(id, form){
  const base = S.openSheet?.base || taskById(id);
  const changes = formChanges(form, base);
  if (!changes.Title && changes.Title !== undefined){ toast("The title cannot be empty."); return; }
  if (!Object.keys(changes).length){ $("#sheet").close(); toast("No changes to save."); return; }
  if (changes.Status === "Blocked" && !(changes.BlockedReason ?? base.BlockedReason)){ toast("Add a blocked reason so the other partners know what it is waiting on."); form.BlockedReason.focus(); return; }
  if (changes.Status === "Done" && !(await confirmDone(base))) return;
  let closed = [];
  const ok = await guarded(async () => {
    let {fresh, ok} = await checkFresh("Tasks", base);
    if (!ok){
      const choice = await conflictDialog(fresh, base, changes);
      if (choice !== "overwrite"){ await refresh(); openTask(id); return false; }
    }
    const rec = {...fresh, ...changes, UpdatedBy: S.me.short, UpdatedAt: nowStamp()};
    if (changes.Status === "Done") rec.CompletedAt = nowStamp();
    else if (changes.Status) rec.CompletedAt = "";
    await S.store.session(async () => {
      await S.store.patch("Tasks", rec);
      if (changes.Status === "Done") closed = await closeOpenSubs(id, rec.UpdatedAt);
      const logs = [logRow(changes.Status==="Done"?"Marked done":"Updated", id, Object.entries(changes).map(([k,v]) => `${k}: "${String(fresh[k]||"").slice(0,60)}" to "${String(v).slice(0,60)}"`).join("; "))];
      if (closed.length) logs.push(logRow("Sub-tasks closed with task", id, `${S.me.short} closed ${closed.length} open sub-task${closed.length===1?"":"s"} when marking the task done: ${closed.map(s => s.SubtaskID).join(", ")}`));
      await S.store.add("ActivityLog", logs);
    });
    return true;
  });
  if (ok){ $("#sheet").close(); toast(closed.length ? `${id} saved, ${closed.length} sub-task${closed.length===1?"":"s"} closed.` : `${id} saved.`); await refresh(); }
}

async function toggleSub(sid, checked, cb){
  const s = S.data.Subtasks.find(x => x.SubtaskID === sid); if (!s) return;
  if (!canTick(s)){ cb.checked = !checked; return; }
  cb.disabled = true;
  const ok = await guarded(async () => {
    const {fresh, ok} = await checkFresh("Subtasks", s);
    if (!ok){
      const choice = await conflictDialog(fresh, s, {Status: checked ? "Done" : "Not started"});
      if (choice !== "overwrite") return false;
    }
    const rec = {...fresh, Status: checked ? "Done" : "In progress", CompletedAt: checked ? nowStamp() : "", UpdatedBy: S.me.short, UpdatedAt: nowStamp()};
    await S.store.session(async () => {
      await S.store.patch("Subtasks", rec);
      await S.store.add("ActivityLog", [logRow(checked ? "Sub-task done" : "Sub-task reopened", s.TaskID, `${sid} ${s.Title}`)]);
    });
    return true;
  });
  await refresh();
  if (S.openSheet?.id === s.TaskID) openTask(s.TaskID);
  if (ok && checked){
    const t = taskById(s.TaskID); const left = subsOf(s.TaskID).filter(x => x.Status !== "Done");
    if (!left.length && t && t.Status !== "Done"){
      if (t.Lead === S.me.short) toast("All sub-tasks are done.", {label:"Mark task done", fn: () => quickDone(t.TaskID)});
      else toast(`All sub-tasks are done. ${DISPLAY[t.Lead]} can now mark the task done.`);
    } else toast(`${sid} marked done.`);
  }
}

/* Any partner can add a sub-task to any task and assign it to any partner. */
async function addSubtask(id){
  const sheet = $("#sheet");
  const titleEl = sheet.querySelector("#as-title"), ownerEl = sheet.querySelector("#as-owner"), dueEl = sheet.querySelector("#as-due"), btn = sheet.querySelector("#as-add");
  const title = clean(titleEl.value), owner = ownerEl.value, due = dueEl.value;
  if (!title){ toast("Write the sub-task first."); titleEl.focus(); return; }
  if (!ORDER.includes(owner)){ toast("Pick an owner."); ownerEl.focus(); return; }
  if (due && due < todayISO()){ toast("The due date is before today."); dueEl.focus(); return; }
  const t = taskById(id); if (!t) return;
  btn.disabled = true;
  let newId = null;
  const ok = await guarded(async () => {
    await S.store.session(async () => {
      const fresh = (await S.store.readTable("Tasks")).find(x => x.TaskID === id);
      if (!fresh) throw new Error(`${id} was removed from the workbook.`);
      if (fresh.Status === "Done") throw new Error(`${id} was marked done by someone else. Reopen it first.`);
      const mine = (await S.store.readTable("Subtasks")).filter(x => x.TaskID === id);
      const n = Math.max(0, ...mine.map(x => +x.Order || 0), ...mine.map(x => +((x.SubtaskID||"").match(/-(\d+)$/)||[0,0])[1])) + 1;
      newId = `${id}-${pad(n)}`;
      const stamp = nowStamp();
      await S.store.add("Subtasks", [{SubtaskID:newId, TaskID:id, Order:n, Title:title, Owner:owner, DueDate:due||"", Status:"Not started", UpdatedBy:S.me.short, UpdatedAt:stamp, CompletedAt:""}]);
      if (fresh.Status === "Needs sub-tasks") await S.store.patch("Tasks", {...fresh, Status:"Not started", UpdatedBy:S.me.short, UpdatedAt:stamp});
      await S.store.add("ActivityLog", [logRow("Sub-task added", id, `${newId} ${title} | owner ${owner}${due?` | due ${due}`:""}`)]);
    });
    return true;
  });
  await refresh();
  if (ok){
    toast(`${newId} added for ${DISPLAY[owner]||owner}.`);
    if (S.openSheet?.id === id){ openTask(id); $("#sheet").querySelector("#as-title")?.focus(); }
  } else if (btn.isConnected) btn.disabled = false;
}

async function quickDone(id){ await setTaskStatus(id, "Done"); }

/* Close every open sub-task of a task (used when the lead marks the whole task done). */
async function closeOpenSubs(id, stamp){
  const open = (await S.store.readTable("Subtasks")).filter(s => s.TaskID === id && s.Status !== "Done");
  if (!open.length) return [];
  await S.store.patchMany("Subtasks", open.map(s => ({...s, Status: "Done", CompletedAt: stamp, UpdatedBy: S.me.short, UpdatedAt: stamp})));
  return open;
}

/* Ask the partner to double-confirm before a task (and all its open sub-tasks) is marked done. */
function confirmDone(t){
  return new Promise(resolve => {
    const open = subsOf(t.TaskID).filter(s => s.Status !== "Done");
    const dlg = $("#dlg");
    dlg.innerHTML = `<div class="in"><h2>Mark ${esc(t.TaskID)} done?</h2><p style="margin:0;color:var(--text-2)">"${esc(t.Title)}"</p>
      ${open.length ? `<p style="margin:12px 0 0">This also closes ${open.length===1?"the 1 open sub-task":`all ${open.length} open sub-tasks`}:</p><ul class="done-list">${open.map(s => `<li><span>${esc(s.Title)}</span><span class="own" style="margin-left:auto">${esc(DISPLAY[s.Owner]||s.Owner)}</span></li>`).join("")}</ul>` : `<p style="margin:12px 0 0;color:var(--text-2)">All sub-tasks are already done.</p>`}
      <label class="confirm-chk"><input type="checkbox" id="doneOk"> <span>I confirm everything on this task is done${open.length?" or no longer needed":""}.</span></label>
      <div class="dlg-actions"><button type="button" class="btn" data-c="cancel">Cancel</button><button type="button" class="btn primary" data-c="ok" disabled>Mark done</button></div></div>`;
    const okBtn = dlg.querySelector('[data-c="ok"]');
    dlg.querySelector("#doneOk").onchange = e => { okBtn.disabled = !e.target.checked; };
    let answered = false;
    dlg.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { answered = true; dlg.close(); resolve(b.dataset.c === "ok"); });
    dlg.onclose = () => { if (!answered) resolve(false); };
    dlg.showModal();
  });
}

function askBlockedReason(t){
  return new Promise(resolve => {
    const dlg = $("#dlg");
    dlg.innerHTML = `<form class="in" method="dialog"><h2>What is ${esc(t.TaskID)} waiting on?</h2><p style="margin:0 0 10px;color:var(--text-2)">The other partners will see this on the task.</p>
      <input id="blkReason" class="inp" style="width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font:inherit" value="${esc(t.BlockedReason||"")}" placeholder="For example: waiting on the landlord's reply">
      <div class="dlg-actions"><button type="button" class="btn" data-c="cancel">Cancel</button><button type="submit" class="btn primary">Set to Blocked</button></div></form>`;
    const inp = dlg.querySelector("#blkReason"); let answered = false;
    dlg.querySelector('[data-c="cancel"]').onclick = () => { answered = true; dlg.close(); resolve(null); };
    dlg.querySelector("form").onsubmit = e => { e.preventDefault(); const v = clean(inp.value); if (!v){ inp.focus(); return; } answered = true; dlg.close(); resolve(v); };
    dlg.onclose = () => { if (!answered) resolve(null); };
    dlg.showModal(); inp.focus();
  });
}

/* Change a task's status from the card icon. Done closes all open sub-tasks after confirmation. */
async function setTaskStatus(id, status){
  const t = taskById(id); if (!t || t.Status === status) return;
  const extra = {};
  if (status === "Done" && !(await confirmDone(t))) return;
  if (status === "Blocked"){ const r = await askBlockedReason(t); if (r === null) return; extra.BlockedReason = r; }
  let closed = [];
  const ok = await guarded(async () => {
    const {fresh, ok} = await checkFresh("Tasks", t);
    if (!ok && (await conflictDialog(fresh, t, {Status: status, ...extra})) !== "overwrite") return false;
    const stamp = nowStamp();
    const rec = {...fresh, ...extra, Status: status, CompletedAt: status === "Done" ? stamp : "", UpdatedBy: S.me.short, UpdatedAt: stamp};
    await S.store.session(async () => {
      await S.store.patch("Tasks", rec);
      if (status === "Done") closed = await closeOpenSubs(id, stamp);
      const logs = [logRow(status === "Done" ? "Marked done" : "Updated", id, `Status: "${fresh.Status}" to "${status}"${extra.BlockedReason ? `; BlockedReason: "${extra.BlockedReason.slice(0,60)}"` : ""}`)];
      if (closed.length) logs.push(logRow("Sub-tasks closed with task", id, `${S.me.short} closed ${closed.length} open sub-task${closed.length===1?"":"s"} when marking the task done: ${closed.map(s => s.SubtaskID).join(", ")}`));
      await S.store.add("ActivityLog", logs);
    });
    return true;
  });
  await refresh();
  if (ok){
    toast(status === "Done" ? `${id} marked done${closed.length ? `, ${closed.length} sub-task${closed.length===1?"":"s"} closed` : ""}.` : `${id} set to ${status}.`);
    if (S.openSheet?.id === id) openTask(id);
  }
}

/* Small status menu that opens from the icon on a card. */
function openStatusMenu(btn){
  const menu = $("#stMenu"); const id = btn.dataset.status; const t = taskById(id); if (!t) return;
  if (menu.classList.contains("open") && menu.dataset.for === id){ closeStatusMenu(); return; }
  closeStatusMenu();
  const list = STATUSES.filter(s => s !== "Needs sub-tasks" || t.Status === s);
  menu.innerHTML = `<div class="mh">${esc(id)} status</div>` + list.map(s => `<button type="button" role="menuitemradio" aria-checked="${s===t.Status}" data-s="${esc(s)}">${statusChip(s)}${s==="Done"?`<span style="font-size:12px;color:var(--muted);font-weight:600">closes sub-tasks</span>`:""}</button>`).join("");
  menu.dataset.for = id; menu.classList.add("open"); btn.setAttribute("aria-expanded","true"); S.menuBtn = btn;
  const r = btn.getBoundingClientRect(), mw = menu.offsetWidth, mh = menu.offsetHeight;
  menu.style.left = Math.max(8, Math.min(r.right - mw, innerWidth - mw - 8)) + "px";
  menu.style.top = (r.bottom + 6 + mh > innerHeight ? Math.max(8, r.top - mh - 6) : r.bottom + 6) + "px";
  menu.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { closeStatusMenu(); setTaskStatus(id, b.dataset.s); });
  (menu.querySelector('[aria-checked="true"]') || menu.querySelector("[data-s]")).focus();
}
function closeStatusMenu(){
  const menu = $("#stMenu"); if (!menu.classList.contains("open")) return;
  menu.classList.remove("open"); menu.dataset.for = "";
  if (S.menuBtn){ S.menuBtn.setAttribute("aria-expanded","false"); S.menuBtn = null; }
}
document.addEventListener("click", e => { if (!e.target.closest("#stMenu") && !e.target.closest("[data-status]")) closeStatusMenu(); });
document.addEventListener("keydown", e => {
  const menu = $("#stMenu"); if (!menu.classList.contains("open")) return;
  if (e.key === "Escape"){ const b = S.menuBtn; closeStatusMenu(); b && b.focus(); }
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); const items = [...menu.querySelectorAll("[data-s]")]; const i = items.indexOf(document.activeElement); items[(i + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length].focus(); }
});
window.addEventListener("scroll", closeStatusMenu, {passive:true});
window.addEventListener("resize", closeStatusMenu);

async function approve(id, p, checked, cb){
  const t = taskById(id); if (p !== S.me.short){ cb.checked = !checked; return; }
  const ok = await guarded(async () => {
    const {fresh, ok} = await checkFresh("Tasks", t);
    if (!ok && (await conflictDialog(fresh, t, {["Approved"+p]: checked ? "Yes" : ""})) !== "overwrite") return false;
    const rec = {...fresh, ["Approved"+p]: checked ? "Yes" : "", UpdatedBy: S.me.short, UpdatedAt: nowStamp()};
    await S.store.session(async () => { await S.store.patch("Tasks", rec); await S.store.add("ActivityLog", [logRow(checked ? "Approved" : "Approval withdrawn", id, `${DISPLAY[p]} ${checked ? "approved" : "withdrew approval"}`)]); });
    return true;
  });
  await refresh(); openTask(id); if (ok) toast(checked ? "Approval recorded." : "Approval withdrawn.");
}

function conflictDialog(fresh, base, changes){
  return new Promise(resolve => {
    const dlg = $("#dlg");
    const keys = [...new Set([...Object.keys(changes), ...Object.keys(fresh).filter(k => base[k] !== undefined && fresh[k] !== base[k] && !["UpdatedAt","UpdatedBy"].includes(k))])];
    dlg.innerHTML = `<div class="in"><h2>Someone else changed this</h2><p style="margin:0;color:var(--text-2)">${esc(DISPLAY[fresh.UpdatedBy]||fresh.UpdatedBy)} updated it at ${fmtStamp(fresh.UpdatedAt)}, after you opened it. Here are their values and yours.</p>
      <table class="diff"><thead><tr><th>Field</th><th>Now in the workbook</th><th>Your change</th></tr></thead><tbody>${keys.map(k => `<tr><td>${esc(k)}</td><td>${esc(fresh[k]||"(blank)")}</td><td>${k in changes ? esc(changes[k]||"(blank)") : "(no change)"}</td></tr>`).join("")}</tbody></table>
      <div class="dlg-actions"><button type="button" class="btn" data-c="keep">Keep their version</button><button type="button" class="btn primary" data-c="overwrite">Save my changes anyway</button></div></div>`;
    dlg.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { dlg.close(); resolve(b.dataset.c); });
    dlg.onclose = () => resolve("keep");
    dlg.showModal();
  });
}
function showError(msg){
  const dlg = $("#dlg");
  dlg.innerHTML = `<div class="in"><h2>Not saved</h2><p style="margin:0;color:var(--text-2)">${esc(msg)}</p><div class="dlg-actions"><button type="button" class="btn primary" data-c>OK</button></div></div>`;
  dlg.querySelector("[data-c]").onclick = () => dlg.close(); dlg.onclose = null; dlg.showModal();
}

/* =====================================================================
   Add task form with suggested lead and support
   ===================================================================== */
function suggest(text){
  const s = " " + text.toLowerCase() + " ";
  const R = ["z","a","n"].filter(k => ROLE[k]);
  const hits = {}; R.forEach(k => hits[k] = KEYWORDS[k].filter(w => new RegExp(`(^|[^a-z])${w.replace(/[.*+?^${}()|[\]\\&]/g,"\\$&")}([^a-z]|$)`).test(s)));
  const scores = R.map(k => [k, hits[k].length]).sort((x,y) => y[1]-x[1]);
  if (!scores.length || !scores[0][1]) return null;
  let lead = scores[0][0];
  const tied = scores.filter(x => x[1] === scores[0][1]).map(x => x[0]);
  if (tied.length > 1){
    if (tied.includes("n") && CUSTOMER_FACING.some(w => s.includes(w))) lead = "n";
    else if (tied.includes("z") && LEGAL_MONEY.some(w => s.includes(w))) lead = "z";
    else if (tied.includes("a")) lead = "a";  /* default tie-break: Managing Partner */
  }
  const sup = R.filter(k => k !== lead && hits[k].length);
  const money = MONEY_WORDS.filter(w => s.includes(w));
  if (money.length && lead !== "a" && !sup.includes("a")) sup.push("a");
  const apa = APA_WORDS.some(w => s.includes(w));
  const N = k => ROLE[k];
  const why = [`${N(lead)} leads because of "${hits[lead].slice(0,3).join('", "')}"`];
  sup.forEach(k => why.push(hits[k].length ? `${N(k)} supports for "${hits[k].slice(0,2).join('", "')}"` : `${N(k)} supports to approve spend ("${money[0].trim()}")`));
  const domain = sup.length >= 2 ? "Cross-cutting" : KEY_DOMAIN[lead];
  return {lead: N(lead), support: sup.slice(0,2).map(N), apa, domain, reason: why.join("; ") + "." + (apa ? " This looks like an ownership, debt, partner, pricing or brand decision, so all-partner approval is suggested." : "")};
}

function openForm(){
  if (!navigator.onLine){ toast("You are offline. Reconnect to add a task."); return; }
  const sheet = $("#sheet"); S.openSheet = null;
  const opt = (list, v) => list.map(o => `<option ${o===v?"selected":""}>${esc(o)}</option>`).join("");
  sheet.style.setProperty("--accent", "var(--espresso)");
  sheet.innerHTML = `<form class="sheet-in" id="addForm" novalidate>
    <div class="sheet-h"><div><h2 id="sheetTitle">Add task</h2><p style="margin:4px 0 0;font-size:13.5px;color:var(--text-2)">The dashboard suggests a lead and support from the partners' duty matrix. You can change them.</p></div><button type="button" class="x" data-close aria-label="Close">${ICON.x}</button></div>
    <div class="sheet-b"><div class="fields">
      <div class="fld full"><label for="a-Title">Title (required)</label><input id="a-Title" name="Title" required placeholder="Start with a verb, for example: Renew the food service license"></div>
      <div class="fld full"><label for="a-Description">Description</label><textarea id="a-Description" name="Description" placeholder="What does done look like? Add amounts in USD and any deadline from a partner meeting."></textarea></div>
      <div class="fld full"><div class="suggest" id="sugBox" aria-live="polite"><p>Type a title to see a suggested lead and support.</p></div></div>
      <div class="fld"><label for="a-DueDate">Due date (required)</label><input type="date" id="a-DueDate" name="DueDate" min="${todayISO()}" required></div>
      <div class="fld"><label for="a-StartDate">Start date</label><input type="date" id="a-StartDate" name="StartDate"></div>
      <div class="fld"><label for="a-Priority">Priority</label><select id="a-Priority" name="Priority">${opt(PRIORITIES,"Medium")}</select></div>
      <div class="fld"><label for="a-Recurrence">Recurrence</label><select id="a-Recurrence" name="Recurrence">${opt(RECURRENCES,"None")}</select></div>
      <div class="fld"><label for="a-Lead">Lead (required)</label><select id="a-Lead" name="Lead">${ORDER.map(p=>`<option value="${p}" ${p===S.me.short?"selected":""}>${DISPLAY[p]}</option>`).join("")}</select></div>
      <div class="fld"><span class="lbl">Support (up to 2)</span><div class="checks">${ORDER.map(p=>`<label class="chk"><input type="checkbox" name="Support" value="${p}"> ${p}</label>`).join("")}</div></div>
      <div class="fld"><label for="a-Domain">Domain</label><select id="a-Domain" name="Domain">${opt(DOMAINS, KEY_DOMAIN[PKEY[S.me.short]])}</select></div>
      <div class="fld"><span class="lbl">All-partner approval</span><label class="chk"><input type="checkbox" name="AllPartnerApproval" value="Yes"> Needs all three partners</label><span class="help">For loans or financing, new partners or investors, equity, pricing changes, brand changes or entering a new state.</span></div>
      <div class="fld full"><label for="a-Notes">Notes</label><textarea id="a-Notes" name="Notes" style="min-height:60px"></textarea></div>
      <div class="fld full"><span class="lbl">Starter sub-tasks</span><div class="suggest" style="display:block"><div id="starterList"></div><label class="chk" style="margin-top:10px"><input type="checkbox" name="useStarters"> Add these starter sub-tasks now</label><p class="help" style="margin:6px 0 0;font-size:12px;color:var(--muted)">If you leave this off, the task is flagged "Needs sub-tasks" and the intake agent writes the full set from the duty matrix.</p></div></div>
    </div></div>
    <div class="sheet-f"><span class="hint">Saved to the shared workbook and logged.</span><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">Add task</button></div></form>`;
  const form = $("#addForm");
  sheet.querySelectorAll("[data-close]").forEach(b => b.onclick = () => sheet.close());
  let lastSug = null, touched = false;
  const updateStarters = () => {
    const lead = form.Lead.value, dom = form.Domain.value;
    $("#starterList").innerHTML = `<ol class="starter">${STARTERS[dom].map(([o,t]) => `<li><b>${o==="L"?lead:(o==="Z"?ROLE.z:o)}</b>: ${esc(t)}</li>`).join("")}</ol>`;
  };
  const applySug = s => {
    form.Lead.value = s.lead; form.Domain.value = s.domain;
    form.querySelectorAll('input[name="Support"]').forEach(cb => cb.checked = s.support.includes(cb.value));
    form.AllPartnerApproval.checked = s.apa; limitSupport(form); updateStarters();
  };
  const onText = () => {
    const s = suggest(form.Title.value + " " + form.Description.value); lastSug = s;
    const box = $("#sugBox");
    if (!s){ box.innerHTML = `<p>No clear match in the duty matrix yet. Pick the lead whose domain owns the outcome. Ties: delivery, systems, money and company-wide calls go to ${esc(DISPLAY[ROLE.a])}, website and marketing to ${esc(DISPLAY[ROLE.n])}, legal, contracts and client relationships to ${esc(DISPLAY[ROLE.z])}.</p>`; return; }
    box.innerHTML = `<p><b>Suggested:</b> lead ${esc(DISPLAY[s.lead])}${s.support.length?`, support ${s.support.map(p=>esc(DISPLAY[p])).join(" and ")}`:""}. ${esc(s.reason)}</p><button type="button" class="btn small" id="useSug">Use suggestion</button>`;
    $("#useSug").onclick = () => { applySug(s); touched = true; };
    if (!touched) applySug(s);
  };
  let tm; form.Title.oninput = form.Description.oninput = () => { clearTimeout(tm); tm = setTimeout(onText, 200); };
  form.Lead.onchange = () => { touched = true; limitSupport(form); updateStarters(); };
  form.Domain.onchange = () => { touched = true; updateStarters(); };
  form.querySelectorAll('input[name="Support"]').forEach(cb => cb.onchange = () => { touched = true; limitSupport(form); });
  limitSupport(form); updateStarters();
  form.onsubmit = e => { e.preventDefault(); createTask(form); };
  sheet.showModal(); setTimeout(() => form.Title.focus(), 50);
}

async function createTask(form){
  const fd = new FormData(form);
  const title = clean(fd.get("Title")), due = fd.get("DueDate");
  if (!title){ toast("Add a title."); form.Title.focus(); return; }
  if (!due){ toast("Add a due date."); form.DueDate.focus(); return; }
  if (due < todayISO()){ toast("The due date is before today."); form.DueDate.focus(); return; }
  const lead = fd.get("Lead");
  const support = fd.getAll("Support").filter(p => p !== lead).slice(0,2);
  const useStarters = !!fd.get("useStarters");
  const dom = fd.get("Domain");
  const ok = await guarded(async () => {
    let newId;
    await S.store.session(async () => {
      const all = await S.store.readAll();
      const n = Math.max(0, ...all.Tasks.map(t => +((t.TaskID||"").match(/^PB-(\d{4})$/)||[0,0])[1])) + 1;
      newId = `PB-${String(n).padStart(4,"0")}`;
      const stamp = nowStamp();
      const subs = useStarters ? STARTERS[dom].map(([o,t], i) => ({SubtaskID:`${newId}-${pad(i+1)}`, TaskID:newId, Order:i+1, Title:t, Owner:o==="L"?lead:(o==="Z"?ROLE.z:o), DueDate:"", Status:"Not started", UpdatedBy:S.me.short, UpdatedAt:stamp, CompletedAt:""})) : [];
      const rec = {TaskID:newId, Title:title, Description:clean(fd.get("Description")), Domain:dom, Lead:lead, Support:support.join(";"), Priority:fd.get("Priority"),
        Status: useStarters ? "Not started" : "Needs sub-tasks", StartDate:fd.get("StartDate")||"", DueDate:due, Recurrence:fd.get("Recurrence"),
        Source:`Dashboard, ${fmtDate(todayISO())} (${S.me.short})`, AllPartnerApproval: fd.get("AllPartnerApproval") ? "Yes" : "No",
        ...Object.fromEntries(ORDER.map(p => ["Approved"+p, ""])), BlockedReason:"", Notes:clean(fd.get("Notes")),
        CreatedBy:S.me.short, CreatedAt:stamp, UpdatedBy:S.me.short, UpdatedAt:stamp, CompletedAt:""};
      await S.store.add("Tasks", [rec]);
      if (subs.length) await S.store.add("Subtasks", subs);
      await S.store.add("ActivityLog", [logRow("Task created", newId, `${title} | lead ${lead} | support ${support.join(", ")||"none"} | ${subs.length?subs.length+" starter sub-tasks":"needs sub-tasks"}`)]);
    });
    return newId;
  });
  if (ok){ $("#sheet").close(); toast(`${ok} added.`); await refresh(); }
}

function openAccount(){
  const dlg = $("#dlg");
  dlg.innerHTML = `<div class="in"><h2>${esc(S.me.name)}</h2><p style="margin:0 0 14px;color:var(--text-2)">${esc(S.me.email||"")}${S.mode==="preview"?" (preview)":""}</p>
    <div class="fld"><span class="lbl">Appearance</span><div class="seg" role="group" aria-label="Appearance">${[["","Automatic"],["light","Light"],["dark","Dark"]].map(([k,l]) => `<button type="button" data-theme="${k}" aria-pressed="${(document.documentElement.dataset.theme||"")===k}">${l}</button>`).join("")}</div></div>
    <div class="dlg-actions">${S.mode==="live"?`<button type="button" class="btn" data-c="out">Sign out</button>`:""}<button type="button" class="btn primary" data-c="close">Done</button></div></div>`;
  dlg.querySelectorAll("[data-theme]").forEach(b => b.onclick = () => { const k = b.dataset.theme; if (k) document.documentElement.dataset.theme = k; else delete document.documentElement.dataset.theme; try { localStorage.setItem("pb-theme", k || "auto"); } catch(e){} openAccount(); render(); });
  dlg.querySelector('[data-c="close"]').onclick = () => dlg.close();
  const out = dlg.querySelector('[data-c="out"]'); if (out) out.onclick = () => Auth.logout();
  dlg.onclose = null; if (!dlg.open) dlg.showModal();
}

/* subtle feather-stroke pattern for the header band (kept out of the logo's clear space by a mask) */
function patternURL(){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56"><g fill="none" stroke="#5E17EB" stroke-width="1.4" stroke-linecap="round"><path d="M14 34c6-10 14-14 28-14"/><path d="M14 40c6-8 14-11 24-11"/><circle cx="42" cy="20" r="2"/></g></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}

/* preview helper: simulate another partner editing a task, to test the conflict prompt */
window.pbSimulateRemoteEdit = (id, who=ORDER[0]) => {
  if (S.mode !== "preview") return "Only available in preview.";
  const r = S.store.data.Tasks.find(t => t.TaskID === id); r.Notes = (r.Notes + " Edited by " + who + ".").trim(); r.UpdatedBy = who; r.UpdatedAt = nowStamp(); return "ok";
};
